# Docker Compose file for Alfresco ACS Community Edition - PRODUCTION with HTTPS
# Configured for domain: dms.eris.cv
# Requires: Traefik with Let's Encrypt SSL certificates
#
# Prerequisites:
# 1. Domain dms.eris.cv pointing to your VPS IP
# 2. Ports 80 and 443 open in firewall
# 3. At least 6GB RAM available
#
# Usage:
#   docker compose -f production-compose.yaml up -d

services:
  alfresco:
    image: docker.io/alfresco/alfresco-content-repository-community:25.3.0
    mem_limit: 1900m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=solr6
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=dms.eris.cv
        -Dshare.port=443
        -Dalfresco.host=dms.eris.cv
        -Dalfresco.port=443
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=https://dms.eris.cv/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 1m
    volumes:
      - alfresco_data:/usr/local/tomcat/alf_data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alfresco.rule=Host(`dms.eris.cv`) && PathPrefix(`/alfresco`)"
      - "traefik.http.routers.alfresco.entrypoints=websecure"
      - "traefik.http.routers.alfresco.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alfresco.middlewares=alfresco-stripprefix"
      - "traefik.http.middlewares.alfresco-stripprefix.stripprefix.prefixes=/alfresco"
      - "traefik.http.services.alfresco.loadbalancer.server.port=8080"
    networks:
      - alfresco-network

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.2.4
    mem_limit: 1536m
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 10s
    depends_on:
      activemq:
        condition: service_healthy
    networks:
      - alfresco-network

  share:
    image: docker.io/alfresco/alfresco-share:25.3.0
    mem_limit: 1g
    environment:
      CSRF_FILTER_ORIGIN: https://dms.eris.cv
      CSRF_FILTER_REFERER: https://dms.eris.cv/share/.*
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=dms.eris.cv
        -Dalfresco.port=443
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=https
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 15s
    depends_on:
      alfresco:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.share.rule=Host(`dms.eris.cv`) && PathPrefix(`/share`)"
      - "traefik.http.routers.share.entrypoints=websecure"
      - "traefik.http.routers.share.tls.certresolver=letsencrypt"
      - "traefik.http.routers.share.middlewares=share-stripprefix"
      - "traefik.http.middlewares.share-stripprefix.stripprefix.prefixes=/share"
      - "traefik.http.services.share.loadbalancer.server.port=8080"
    networks:
      - alfresco-network

  postgres:
    image: postgres:16.5
    mem_limit: 512m
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - alfresco-network

  solr6:
    image: docker.io/alfresco/alfresco-search-services:2.0.17
    mem_limit: 2g
    environment:
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      SOLR_SOLR_HOST: "solr6"
      SOLR_SOLR_PORT: "8983"
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=secret
    networks:
      - alfresco-network

  activemq:
    image: alfresco/alfresco-activemq:5.18-jre17-rockylinux8
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health", "|", "grep", "Good"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - alfresco-network

  traefik:
    image: traefik:v3.6
    mem_limit: 128m
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@eris.cv"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8888:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.dms.eris.cv`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.services.traefik.loadbalancer.server.port=8888"
    networks:
      - alfresco-network
    restart: unless-stopped

volumes:
  alfresco_data:
    driver: local
  postgres_data:
    driver: local
  traefik_letsencrypt:
    driver: local

networks:
  alfresco-network:
    driver: bridge

